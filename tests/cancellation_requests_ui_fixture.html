<!doctype html><html><head><meta charset="utf-8"><title>Cancellation review UI test</title>
</head><body>
<link rel="stylesheet" href="../assets/css/cancellation-requests.css" data-persist-layout="1">
<h1>Cancellation review interaction test</h1><p id="result">Running...</p>
<main id="testPage">
<div><button class="view-toggle-btn active" data-view="list">List View</button><button class="view-toggle-btn" data-view="calendar">Calendar View</button><button type="button" class="cancellation-tab">Cancellation Requests (<span data-cancellation-count>0</span>)</button><button id="online">Online Booking</button></div>
<div id="listView">Scheduled appointments</div><div id="calendarView">Calendar</div>
<div class="queue-grid-right"><section class="section-card" id="pending"><h2>Pending Approval</h2><div id="pending-approval-list"></div></section></div>
<a class="notif-item unread" data-notif-id="21" href="staff_appointments.php?cancellation_request=1">Cancellation notification</a>
</main>
<script>
const initialPage = document.getElementById('testPage').innerHTML;
window.CANCELLATION_REVIEW_CSRF = 'test-token';
const reviewCalls = [];
let rows = [1,2].map(id => ({ id, appointment_id:id + 10, first_name:'Test', last_name:'Patient', phone:'09123456789',
    appointment_date:'2099-01-01', appointment_time:'10:00:00', reason:'Cannot attend', status:'pending', appointment_status:'Scheduled', service_name:'Consultation', requested_at:'2026-10-07 10:00:00' }));
window.fetch = async (url, options = {}) => {
    url = new URL(url, location.href);
    if (url.pathname.endsWith('notification_actions.php')) return { json:async () => ({success:true}) };
    if (options.method === 'POST') {
        const input = JSON.parse(options.body); reviewCalls.push(input);
        rows.find(row => row.id === input.request_id).status = input.decision === 'approve' ? 'approved' : 'declined';
        return { json:async () => ({success:true,message:'Reviewed successfully'}) };
    }
    const id = Number(url.searchParams.get('id'));
    return { json:async () => ({success:true,requests:rows.filter(row => id ? row.id === id : row.status === 'pending').map(row => ({...row}))}) };
};
</script>
<script src="../assets/js/cancellation-requests.js"></script>
<script>
const tick = () => new Promise(resolve => setTimeout(resolve, 30));
function check(value, message) { if (!value) throw new Error(message); }
document.addEventListener('DOMContentLoaded', async () => {
    try {
        await tick();
        const calendar = document.querySelector('[data-view=calendar]'), tab = document.querySelector('.cancellation-tab');
        check(calendar.nextElementSibling === tab && tab.nextElementSibling.id === 'online', 'Third cancellation tab and fourth Online Booking');
        check(document.getElementById('pending').nextElementSibling.id === 'dashboardCancellationRequests', 'Dashboard section below Pending Approval');
        tab.click(); await tick();
        check(!document.getElementById('cancellationRequestsPanel').hidden && document.getElementById('listView').style.display === 'none', 'Cancellation view opens');
        const before = location.href;
        document.querySelector('.notif-item').click(); await tick();
        const overlay = document.querySelector('.cancellation-review-overlay');
        check(!overlay.hidden && location.href === before, 'Notification opens modal without navigation');
        check(overlay.textContent.includes('Cannot attend') && overlay.querySelector('a').href.startsWith('tel:'), 'Reason and patient phone displayed');
        overlay.querySelector('[data-review-note]').value = 'Confirmed by phone';
        overlay.querySelector('[data-decision=decline]').click(); await tick();
        check(reviewCalls[0].decision === 'decline' && reviewCalls[0].csrf === 'test-token', 'Decline submits authenticated decision');
        overlay.querySelector('[data-review-close]').click();
        document.querySelector('#cancellationRequestsPanel .cancellation-request-row button').click(); await tick();
        overlay.querySelector('[data-decision=approve]').click(); await tick();
        check(reviewCalls[1].decision === 'approve' && reviewCalls[1].request_id === 2, 'Approve acts on correct request');
        check(document.querySelector('#cancellationRequestsPanel [data-cancellation-list]').textContent.includes('No pending'), 'Reviewed requests removed');
        overlay.querySelector('[data-review-close]').click();
        document.querySelector('[data-view=list]').click();
        check(document.getElementById('cancellationRequestsPanel').hidden && document.getElementById('listView').style.display === '', 'Return to list');
        for (let i = 0; i < 2; i++) {
            // Mirror the router's shell snapshot: page content is replaced and
            // only layout nodes or explicitly persistent body nodes survive.
            [...document.body.children].forEach(node => {
                if (!['H1','P','MAIN'].includes(node.tagName) && node.getAttribute('data-persist-layout') !== '1') node.remove();
            });
            const page = document.getElementById('testPage');
            page.innerHTML = '<p>Another page</p>';
            document.dispatchEvent(new CustomEvent('pjax:loaded')); await tick();
            page.innerHTML = initialPage;
            document.dispatchEvent(new CustomEvent('pjax:loaded')); await tick();
            const returnedTab = document.querySelector('.cancellation-tab');
            check(returnedTab && document.querySelectorAll('.cancellation-tab').length === 1, 'One cancellation button after returning');
            check(getComputedStyle(returnedTab).borderRadius === '6px', 'Cancellation button retains stylesheet after navigation');
            returnedTab.click(); await tick();
            check(!document.getElementById('cancellationRequestsPanel').hidden, 'Returned cancellation tab works');
            document.querySelector('.notif-item').click(); await tick();
            check(overlay.isConnected && !overlay.hidden, 'Shared notification modal survives navigation');
            overlay.querySelector('[data-review-close]').click();
        }
        document.getElementById('result').textContent = 'PASS: tab order, dashboard, notification review, approve/decline, and styled functional controls after repeated navigation.';
    } catch (error) { document.getElementById('result').textContent = 'FAIL: ' + error.message; }
});
</script></body></html>
